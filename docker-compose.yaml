version: "3.9"

services:
  postgres:
    image: postgres:17
    container_name: ridesafe-postgres
    restart: always
    env_file:
      - .env.docker
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build: .
    
    env_file:
      - .env.docker
    container_name: ridesafe-api
    depends_on:
      - postgres
    ports:
      - "8080:8080"
  
volumes:
  postgres-data:


